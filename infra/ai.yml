AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Meetings App — Lab 6: Paste an agenda (AWS Bedrock Claude Parser Lambda).
  Runs outside VPC for $0 idle cost, authenticates via Cognito JWKS,
  calls Bedrock Mantle / Anthropic Messages API, and serves a Function URL.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Base name for all resources in this stack.
  ImageUri:
    Type: String
    Description: URI of the backend Docker image in ECR (linux/amd64 or arm64).
  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]
    Description: Instruction set architecture for the Lambda function.
  CorsOrigins:
    Type: String
    Default: "http://localhost:3000,http://localhost:5173"
    Description: Comma-separated browser origins allowed to call the Function URL.
  ParserModel:
    Type: String
    Default: "anthropic.claude-haiku-4-5-20251001-v1:0"
    Description: Bedrock foundation model ID for agenda parsing.
  PromptVersion:
    Type: String
    Default: "agenda-v1"
    Description: Version identifier for prompt tracking and evaluation.
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID used to verify incoming ID tokens via JWKS.
  CognitoClientId:
    Type: String
    Description: Cognito User Pool Client ID.

Resources:
  # =====================================================================
  # CloudWatch Log Group (7-day retention)
  # =====================================================================
  AgendaParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agenda-parser"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # =====================================================================
  # IAM Execution Role: basic Lambda logs + Bedrock invocation
  # =====================================================================
  AgendaParserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-agenda-parser-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: BedrockInferenceAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-mantle:CreateInference
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # =====================================================================
  # Agenda Parser Lambda Function (Runs OUTSIDE VPC, $0 idle cost)
  # =====================================================================
  AgendaParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.ai.agenda_lambda.handler"]
      Role: !GetAtt AgendaParserRole.Arn
      Architectures: [!Ref Architecture]
      MemorySize: 512
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref AgendaParserLogGroup
      Environment:
        Variables:
          PROJECT_NAME: !Ref ProjectName
          PARSER_MODEL: !Ref ParserModel
          PARSER_PROMPT_VERSION: !Ref PromptVersion
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_REGION: !Ref "AWS::Region"
          BEDROCK_REGION: !Ref "AWS::Region"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # =====================================================================
  # Public Lambda Function URL (AuthType: NONE with CORS)
  # Authentication is enforced inside the handler via Cognito JWT verification.
  # =====================================================================
  AgendaParserFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref AgendaParserFunction
      AuthType: NONE
      Cors:
        AllowOrigins: !Split [",", !Ref CorsOrigins]
        AllowMethods: ["*"]
        AllowHeaders: ["authorization", "content-type"]
        MaxAge: 3600

  AgendaParserFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgendaParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  AgendaParserFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgendaParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  AgendaParserFunctionUrl:
    Description: Public Function URL for agenda parser Lambda (CORS-enabled).
    Value: !GetAtt AgendaParserFunctionUrl.FunctionUrl
  AgendaParserFunctionName:
    Description: Name of the agenda parser Lambda function.
    Value: !Ref AgendaParserFunction
  AgendaParserFunctionArn:
    Description: ARN of the agenda parser Lambda function.
    Value: !GetAtt AgendaParserFunction.Arn

